
spring.application.name=battery-thermal

# MongoDB connection (local default; Render will use Atlas)
# spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ev_battery_thermal}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ev_battery_thermal}

# Server port (Render provides PORT automatically)
server.port=${PORT:8080}

# JWT secret
jwt.secret=${JWT_SECRET}

# ML service URL (local default; Render will use deployed ML service)
ml.api.url=${ML_API_URL:http://127.0.0.1:5000}
